name: Backtest score validation

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/backtest.py
      - .github/workflows/backtest.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtest
        run: python scripts/backtest.py
