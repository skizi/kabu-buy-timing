name: Update data & deploy

on:
  schedule:
    # 07:35 JST(米国市場クローズ後)/ 16:10 JST(東京市場クローズ後)
    - cron: "35 22 * * 0-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - claude/stock-timing-indicator-app-cq4hra
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update market data ($(date -u +%Y-%m-%d))"
            git push
          fi

      # gh-pages ブランチに同じ内容をプッシュして GitHub Pages で公開する
      - name: Deploy to gh-pages branch
        run: git push -f origin HEAD:gh-pages

      # 公開リポジトリのscheduleは非アクティブ60日で自動無効化されるため、
      # 実行のたびに自己再有効化して無効化タイマーを予防する
      - name: Keep scheduled workflow enabled
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/update-data.yml/enable" \
            || echo "enable call failed (non-fatal)"
